<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChessScout — Dashboard redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070906;--side:#0c100a;--text:#f2f6eb;--muted:#a3ad98;--line:rgba(255,255,255,.12);
  --g:#7fd14f;--or:#ff8a3d;--vi:#8a94ff;--go:#f2d04a;--red:#ff6a4a;--grey:#8b8f84;
  --card:linear-gradient(180deg,#1b2215,#141a10);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 .96rem/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--g);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}

/* sidebar */
.sb{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;padding:1.1rem .75rem;background:var(--side);border-right:1px solid var(--line);overflow-y:auto}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.12rem;padding:.2rem .7rem 1rem}
.logo i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--g);color:#0a0d08;font-style:normal}
.sb h6{margin:1.1rem .8rem .35rem;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:#6d7866;font-weight:700}
.sb a{position:relative;display:flex;align-items:center;gap:.65rem;padding:.42rem .7rem;border-radius:10px;color:var(--muted);font-weight:500;font-size:.9rem;transition:background .15s,color .15s}
.sb a .ic{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}
.sb a:hover{background:rgba(255,255,255,.06);color:var(--text)}
.sb a[aria-current]{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--text);font-weight:700;box-shadow:inset 3px 0 0 var(--ac)}
.sb a em{margin-left:auto;font-style:normal;font-size:.6rem;font-weight:800;background:rgba(242,208,74,.2);color:var(--go);border-radius:5px;padding:.05rem .4rem}
.me{margin-top:auto;display:flex;align-items:center;gap:.65rem;padding:.7rem;border:1px solid var(--line);border-radius:12px;background:#121810}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6fb13a,#2c4a19);display:grid;place-items:center;font-weight:800}
.me b{display:block;font-size:.85rem;line-height:1.2}.me small{color:var(--muted);font-size:.74rem}


main{min-width:0;padding:1.2rem clamp(1rem,3vw,2.25rem) 3rem;max-width:1280px;width:100%}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;font-size:.8rem;color:var(--muted);border:1px dashed var(--line);border-radius:12px;padding:.45rem .8rem;margin-bottom:1.2rem}
.seg{display:inline-flex;background:rgba(255,255,255,.07);border-radius:9px;padding:2px}
.seg button{all:unset;cursor:pointer;padding:.25rem .8rem;border-radius:7px;font-weight:600;font-size:.8rem}
.seg button[aria-pressed=true]{background:var(--g);color:#0a0d08}
.seg button:focus-visible{outline:2px solid var(--g)}
.cols{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.col{display:grid;grid-template-columns:minmax(0,1fr);gap:1.25rem;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.25rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 14px 30px -20px rgba(0,0,0,.9)}
.card h2{font-size:1.05rem;font-weight:800;margin:0;letter-spacing:-.01em}
.hd{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:.9rem}
.lnk{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--g)}
.lnk:hover{text-decoration:underline}
.tag{display:inline-block;font-size:.66rem;font-weight:800;padding:.1rem .55rem;border-radius:99px;margin-left:.45rem;vertical-align:middle;background:rgba(255,255,255,.1);color:var(--muted)}
.b1,.b2{display:inline-flex;align-items:center;gap:.45rem;border:0;border-radius:10px;padding:.6rem 1.05rem;font-weight:700;transition:transform .15s,background .15s}
.b1{background:var(--g);color:#0a0d08;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.b1:hover{background:#95e063;transform:translateY(-1px)}
.b2{background:rgba(255,255,255,.08);border:1px solid var(--line)}
.b2:hover{background:rgba(255,255,255,.14)}

/* hero profile bar */
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.5rem;background:linear-gradient(115deg,rgba(127,209,79,.26),rgba(127,209,79,.06) 70%),#141a10;border-color:rgba(127,209,79,.4);padding:1.1rem 1.25rem}
.id{display:flex;align-items:center;gap:.85rem;min-width:190px}
.id .av{width:52px;height:52px;font-size:1.3rem}
.id b{display:block;font-size:1.1rem;font-weight:800;line-height:1.2}.id small{color:var(--muted);font-size:.8rem}
.st{display:flex;gap:1.6rem;flex:1;flex-wrap:wrap}
.st div b{display:block;font-size:1.55rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}.st div small{color:var(--muted);font-size:.74rem;font-weight:600}
.wdl{display:flex;height:6px;border-radius:9px;overflow:hidden;margin-top:.35rem;width:110px}.wdl i{display:block}
.act{display:flex;gap:.6rem;flex-wrap:wrap}

/* weaknesses */
.wk{background:linear-gradient(180deg,rgba(255,106,74,.14),rgba(255,106,74,0) 45%),var(--card);border-color:rgba(255,120,80,.5);padding:1.4rem}
.warn{display:inline-flex;align-items:center;gap:.4rem;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#ffc2b3;background:rgba(255,106,74,.18);border:1px solid rgba(255,106,74,.45);border-radius:99px;padding:.2rem .7rem}
.wk h3{font-size:clamp(1.25rem,2.2vw,1.6rem);line-height:1.2;letter-spacing:-.02em;margin:.7rem 0 .35rem;font-weight:800}
.wk p{color:var(--muted);margin:0 0 1rem;max-width:56ch}
.ins{display:flex;gap:.6rem;align-items:flex-start;background:rgba(242,208,74,.1);border:1px solid rgba(242,208,74,.35);border-radius:12px;padding:.6rem .85rem;font-size:.88rem;margin-bottom:1rem}
.ins b{color:var(--go)}
.cta{display:flex;align-items:center;flex-wrap:wrap;gap:.8rem}
.cta .tag{margin:0;background:rgba(242,208,74,.18);color:var(--go)}
.ghost{display:grid;grid-template-columns:minmax(0,1fr);gap:.55rem;margin-top:1.1rem}
.gh{display:flex;align-items:center;gap:.8rem;border:1px dashed rgba(255,255,255,.18);border-radius:12px;padding:.6rem .8rem}
.gh u{width:46px;height:46px;border-radius:8px;background:rgba(255,255,255,.07);flex:none}
.gh i{display:block;height:9px;border-radius:9px;background:rgba(255,255,255,.1);flex:1}
.wr{display:grid;grid-template-columns:minmax(0,1fr);gap:.6rem}
.w{display:flex;align-items:center;gap:.9rem;border:1px solid var(--line);border-radius:14px;padding:.7rem .9rem .7rem .7rem;background:rgba(0,0,0,.22);transition:border-color .15s,transform .15s}
.w:hover{border-color:rgba(255,138,90,.7);transform:translateX(2px)}
.mb{display:grid;grid-template-columns:repeat(8,1fr);width:58px;height:58px;border-radius:7px;overflow:hidden;flex:none}
.mb i{display:block}.mb i:nth-child(odd){background:var(--sq1,#eaecd0)}.mb i:nth-child(even){background:var(--sq2,#6f9450)}
.mb .h{background:var(--red)!important}
.w div.t{flex:1;min-width:0}.w b{display:block;font-size:.96rem}.w small{color:var(--muted);font-size:.8rem}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:.4rem;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);border-radius:9px}
.sev{font-size:.68rem;font-weight:800;padding:.15rem .6rem;border-radius:99px;white-space:nowrap}
.sev.hi{background:rgba(255,106,74,.22);color:#ffb3a0}.sev.md{background:rgba(242,208,74,.2);color:var(--go)}
.ch{color:var(--muted);font-size:1.2rem}

/* games */
.gl{display:grid;grid-template-columns:minmax(0,1fr);gap:.5rem}
.g{display:flex;align-items:center;gap:.9rem;padding:.6rem .8rem;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid transparent;transition:background .15s,border-color .15s}
.g:hover{background:rgba(255,255,255,.06);border-color:var(--line)}
.rs{flex:none;width:54px;text-align:center;font-size:.7rem;font-weight:800;letter-spacing:.05em;padding:.3rem 0;border-radius:8px}
.rs.W{background:rgba(127,209,79,.2);color:var(--g)}.rs.L{background:rgba(255,106,74,.2);color:#ff9d86}.rs.D{background:rgba(255,255,255,.12);color:#d0d4c8}
.g .t{flex:1;min-width:0}.g b{font-size:.93rem}.g b span{color:var(--muted);font-weight:500}
.g small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g .r{text-align:right;font-size:.76rem;color:var(--muted);flex:none}.g .r b{display:block;color:var(--text);font-size:.86rem}

/* quick tools */
.qt{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.q{display:flex;flex-direction:column;gap:.55rem;padding:.9rem;border-radius:14px;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 26%,#141a10),#141a10 75%);border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);transition:transform .15s,border-color .15s;min-height:118px}
.q:hover{transform:translateY(-2px);border-color:var(--ac)}
.q .ic{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--ac) 25%,transparent);color:var(--ac)}
.q b{font-size:.94rem;display:block;line-height:1.2}.q small{color:var(--muted);font-size:.76rem;line-height:1.3;display:block}
.q em{font-style:normal;font-size:.6rem;font-weight:800;background:rgba(242,208,74,.2);color:var(--go);border-radius:5px;padding:.05rem .4rem;margin-left:.3rem;vertical-align:middle}
.ex{background:#10150d;box-shadow:none}
.ex .row{display:flex;align-items:center;gap:.7rem;padding:.55rem .4rem;border-radius:10px;color:var(--muted)}
.ex .row:hover{background:rgba(255,255,255,.05);color:var(--text)}
.ex .row .ic{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.07)}
.ex b{display:block;font-size:.88rem;color:var(--text)}.ex small{font-size:.75rem}
.pro{display:flex;align-items:center;gap:.8rem;border:1px solid rgba(242,208,74,.35);border-radius:14px;padding:.8rem .9rem;background:rgba(242,208,74,.07);font-size:.82rem;color:var(--muted);margin-top:.6rem}
.pro b{color:var(--text);display:block;font-size:.88rem}.pro .b2{margin-left:auto;padding:.4rem .8rem;font-size:.8rem;flex:none}
.foot{margin-top:1.4rem;color:#6d7866;font-size:.78rem}


.pg{display:grid;grid-template-columns:minmax(0,1fr);gap:1.1rem}
.ph{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.ph .ic{display:grid;place-items:center;width:50px;height:50px;border-radius:14px;background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac)}
.ph .ic svg{width:25px;height:25px}
.ph h1{font-size:1.55rem;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.2}.ph p{margin:.1rem 0 0;color:var(--muted);max-width:60ch}.ph .rt{margin-left:auto}
.tabs{display:inline-flex;gap:.25rem;background:rgba(255,255,255,.06);border-radius:12px;padding:.25rem;flex-wrap:wrap;justify-self:start}
.tabs button{all:unset;cursor:pointer;padding:.45rem 1rem;border-radius:9px;font-weight:700;font-size:.88rem;color:var(--muted)}
.tabs button:hover{color:var(--text)}.tabs [aria-pressed=true]{background:var(--g);color:#0a0d08}
.tabs button:focus-visible,.chips button:focus-visible{outline:2px solid var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chips button{all:unset;cursor:pointer;padding:.35rem .9rem;border-radius:99px;border:1px solid var(--line);font-size:.84rem;font-weight:600;color:var(--muted)}
.chips button:hover{color:var(--text)}.chips [aria-pressed=true]{background:var(--g);color:#0a0d08;border-color:var(--g)}
.inp{flex:1;min-width:160px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:.65rem .9rem;color:var(--text);font:inherit}
.inp:focus{outline:2px solid var(--g);border-color:transparent}
.frm{display:flex;gap:.6rem;flex-wrap:wrap}
.emp{text-align:center;padding:2.2rem 1rem;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}
.emp svg{width:38px;height:38px;opacity:.5}.emp b{display:block;color:var(--text);font-size:1.1rem;margin:.6rem 0 .25rem}.emp .b1{margin-top:1rem}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.1rem}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.kpi{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem}
.kpi small{display:block;color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.kpi b{font-size:1.15rem;font-weight:800;display:block;margin-top:.15rem;line-height:1.3}.kpi span{color:var(--muted);font-size:.8rem}
.note{font-size:.82rem;color:var(--muted);margin:.7rem 0 0}
.sub2{color:var(--muted);font-size:.85rem;margin:.7rem 0 1rem}
.op{display:grid;grid-template-columns:52px minmax(0,1fr) 120px 110px 96px;gap:.8rem;align-items:center;padding:.65rem .4rem;border-top:1px solid var(--line);font-size:.9rem}
.eco{font-size:.72rem;font-weight:800;text-align:center;background:rgba(242,208,74,.18);color:var(--go);border-radius:7px;padding:.2rem 0}
.op small{color:var(--muted);font-size:.78rem}
.botg{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:1rem}
.bot{display:flex;flex-direction:column;gap:.35rem;border-radius:16px;padding:1rem;min-height:190px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(160deg,var(--c),#10140d 85%);transition:transform .15s}
.bot:hover{transform:translateY(-2px)}.bot h3{margin:0;font-size:1.05rem}.bot small{color:var(--muted);font-size:.8rem;flex:1}
.bot .elo{align-self:flex-end;font-size:.72rem;font-weight:800;background:rgba(0,0,0,.35);border-radius:99px;padding:.15rem .6rem}
.bot em{font-style:normal;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.bot button{all:unset;cursor:pointer;font-weight:700;font-size:.85rem;color:#fff}
.acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem}
.ap{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:13px;padding:.9rem}.ap.low{border-color:rgba(242,208,74,.55)}
.ap small{color:var(--muted);font-size:.78rem;display:block}.ap b{font-size:1.7rem;font-weight:800}
.mk{display:flex;flex-wrap:wrap;gap:.3rem;font-size:.72rem;font-weight:700}.mk span{padding:.05rem .45rem;border-radius:6px;background:rgba(255,255,255,.07)}
.dn{display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap}
.donut{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;flex:none}
.donut div{width:88px;height:88px;border-radius:50%;background:#161c11;display:grid;place-items:center;text-align:center;line-height:1.1}
.donut b{font-size:1.45rem;font-weight:800}.donut small{font-size:.68rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;flex:1;min-width:170px}
.kv div{background:rgba(0,0,0,.22);border-radius:10px;padding:.45rem .7rem}.kv b{display:block;font-size:1.05rem}.kv small{color:var(--muted);font-size:.72rem}
.lc{width:100%;height:auto}
.stk{display:flex;height:9px;border-radius:9px;overflow:hidden;margin-top:.7rem}
.tcg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;max-width:520px}
.tcg button{all:unset;cursor:pointer;text-align:center;padding:1.1rem .5rem;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.22);font-weight:700;transition:border-color .15s,background .15s}
.tcg button:hover{border-color:var(--g)}.tcg [aria-pressed=true]{border-color:var(--g);background:rgba(127,209,79,.14);color:var(--g)}
.tcg button:focus-visible{outline:2px solid var(--g)}
.ck{display:flex;justify-content:space-between;gap:1rem;font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;margin:1rem 0}
.pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.1rem}
.pl ul{padding-left:1.1rem;color:var(--muted);margin:.8rem 0 1.2rem}
.pl .big{font-size:2rem;font-weight:800}.pl .big small{font-size:.9rem;color:var(--muted);font-weight:500}
.cd{display:flex;align-items:center;gap:1rem;padding:1rem 1.1rem;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.22);width:100%;text-align:left;transition:border-color .15s}
.cd:hover{border-color:var(--g)}.cd .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:rgba(127,209,79,.16);color:var(--g)}.cd b{display:block}.cd small{color:var(--muted)}
.swg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:.7rem}
.swc{all:unset;cursor:pointer;display:grid;gap:.4rem;padding:.6rem;border-radius:14px;border:1px solid var(--line);text-align:center;font-size:.78rem;font-weight:600;color:var(--muted)}
.swc[aria-pressed=true]{border-color:var(--g);color:var(--g);background:rgba(127,209,79,.1)}.swc:focus-visible{outline:2px solid var(--g)}
.sq4{display:grid;grid-template-columns:1fr 1fr;width:54px;height:54px;border-radius:8px;overflow:hidden;margin:auto}
.pv{display:grid;grid-template-columns:repeat(8,1fr);width:176px;height:176px;border-radius:10px;overflow:hidden;flex:none}
.pv i:nth-child(odd){background:var(--sq1,#eeeed2)}.pv i:nth-child(even){background:var(--sq2,#769656)}
.trw{display:flex;align-items:center;gap:1rem;padding:.8rem .2rem;border-top:1px solid var(--line)}.trw div{flex:1}.trw small{color:var(--muted);display:block}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:25px;border-radius:99px;background:#3a4034;position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--g)}.sw:checked::after{left:22px}.sw:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.rng{width:100%;accent-color:var(--g)}
.amb{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;border:0;border-radius:12px;padding:.85rem;background:linear-gradient(180deg,#f5a524,#e08a00);color:#1a1000;font-weight:800}
@media (max-width:1050px){.cols,.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sb{position:static;height:auto;flex-direction:row;align-items:center;gap:.25rem;overflow-x:auto;padding:.6rem;border-right:0;border-bottom:1px solid var(--line)}
  .sb h6,.me{display:none}.logo{padding:0 .6rem 0 .2rem;flex:none}.sb a{flex:none;white-space:nowrap}
  .st{gap:1.2rem}.g small{max-width:30ch}
  .op{grid-template-columns:48px minmax(0,1fr) 84px}.op .hm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sb" id="sb" aria-label="Main navigation"></aside>

  <main id="view" tabindex="-1"></main>
<template id="t-home">
    <div class="strip"><span>Design preview</span>
      <div class="seg" role="group" aria-label="Preview state"><button data-s="before" aria-pressed="true">Before analysis</button><button data-s="after" aria-pressed="false">After analysis</button></div>
    </div>

    <div class="cols">

/* ---------- router ---------- */
var cur="";
function go(k){var same=k===cur;cur=k;$("#view").innerHTML=(P[k]||function(){return P.soon(k)})();if(I[k])I[k]();
  $$(".sb a").forEach(function(a){if(a.dataset.go===k)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});

document.addEventListener("click",function(e){
  var a=e.target.closest("[data-go]");if(a){e.preventDefault();go(a.dataset.go);return}
  var x=e.target.closest("[data-act]");if(!x)return;var t=x.dataset.act;
  if(t==="set"){S[x.dataset.k]=x.dataset.v;if(x.dataset.k==="bc")applyBoard();go(cur)}
  else if(t==="tg"){S.tg[+x.dataset.i]^=1}
  else if(A[t])A[t](x)});
document.addEventListener("input",function(e){var k=e.target.dataset.in;if(!k)return;
  if(k==="gq"){S.gq=e.target.value;$("#gl2").innerHTML=glist()}
  else if(k==="oq"){S.oq=e.target.value;$("#ol").innerHTML=olist()}
  else if(k==="mo"){S.mo=+e.target.value;S.imp=0;$("#mol").textContent=S.mo+" month"+(S.mo>1?"s":"")}});

})();
